version: '3.8'
services:
  mc:
    image: itzg/minecraft-server
    ports:
      - "25565:25565"
      - "25575:25575" # Port RCON (optionnel)
    environment:
      EULA: "TRUE"
      MEMORY: "6G"
      TYPE: "PAPER"
      VERSION: "1.21.11"
      ENABLE_RCON: "true"
      RCON_PASSWORD: "password" # Changez-le !
    volumes:
      - ./data:/data
      - ./plugins:/plugins # Pour ajouter des plugins manuellement
    restart: unless-stopped
